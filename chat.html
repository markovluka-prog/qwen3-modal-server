<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3.6 Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --bubble-user: #2a3550;
    --bubble-bot: #1e222c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #endpoint-config {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  #endpoint-url, #auth-token {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
  }
  .msg.err {
    align-self: flex-start;
    background: #3a1f22;
    color: #ff8f8f;
  }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  #prompt {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Qwen3.6-27B</h1>
    <span class="muted">Modal endpoint chat</span>
  </header>

  <div id="endpoint-config">
    <input id="endpoint-url" type="text"
      placeholder="https://<workspace>--qwen36-27b-model-generate.modal.run"
      value="">
    <input id="auth-token" type="password"
      placeholder="Bearer-токен (тот же, что в modal secret create)"
      value="">
  </div>

  <div id="chat"></div>

  <form id="composer">
    <textarea id="prompt" rows="1" placeholder="Введите сообщение..."></textarea>
    <button id="send-btn" type="submit">Отправить</button>
  </form>

<script>
(function () {
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('composer');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('send-btn');
  const endpointEl = document.getElementById('endpoint-url');
  const tokenEl = document.getElementById('auth-token');

  const STORAGE_KEY = 'qwen36_endpoint_url';
  const TOKEN_STORAGE_KEY = 'qwen36_auth_token';
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) endpointEl.value = saved;
    const savedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
    if (savedToken) tokenEl.value = savedToken;
  } catch (e) { /* localStorage недоступен -- просто игнорируем */ }

  endpointEl.addEventListener('change', () => {
    try { localStorage.setItem(STORAGE_KEY, endpointEl.value.trim()); }
    catch (e) { /* private mode / заблокировано -- не критично */ }
  });

  tokenEl.addEventListener('change', () => {
    try { localStorage.setItem(TOKEN_STORAGE_KEY, tokenEl.value.trim()); }
    catch (e) { /* private mode / заблокировано -- не критично */ }
  });

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendMessage(text) {
    const url = endpointEl.value.trim();
    const token = tokenEl.value.trim();
    if (!url) {
      addMessage('Укажите URL Modal-эндпоинта выше.', 'err');
      return;
    }
    if (!token) {
      addMessage('Укажите bearer-токен выше (тот же, что задан через modal secret create).', 'err');
      return;
    }

    addMessage(text, 'user');
    const pending = addMessage('', 'bot');
    sendBtn.disabled = true;

    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({ text: text, max_tokens: 350, stream: true }),
      });

      if (resp.status === 401) {
        pending.textContent = 'Токен неверный (401) -- проверьте значение bearer-токена.';
        pending.className = 'msg err';
        return;
      }

      if (!resp.ok) {
        const errText = await resp.text();
        pending.textContent = 'Ошибка ' + resp.status + ': ' + errText;
        pending.className = 'msg err';
        return;
      }

      // Стриминг SSE: сервер шлёт "data: {...}\n\n" по мере генерации
      // токенов -- текст появляется сразу, а не после полного ответа.
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';

      // Батчинг DOM-обновлений через requestAnimationFrame: без этого
      // pending.textContent обновляется на КАЖДЫЙ SSE-чанк, вызывая
      // синхронный reflow/layout браузера при каждом токене -- десятки
      // forced-reflow в секунду на быстрой генерации (особенно заметно со
      // спекулятивным декодированием на сервере). requestAnimationFrame
      // схлопывает все обновления между кадрами в одну перерисовку --
      // максимум 60 обновлений DOM в секунду вместо одного на токен.
      let rafScheduled = false;
      function scheduleRender() {
        if (rafScheduled) return;
        rafScheduled = true;
        requestAnimationFrame(() => {
          pending.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
          rafScheduled = false;
        });
      }

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n\n');
        buffer = lines.pop(); // последний кусок может быть неполным -- оставляем в буфере

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;
          try {
            const { delta } = JSON.parse(payload);
            if (delta) {
              full += delta;
              scheduleRender();
            }
          } catch (e) { /* неполный JSON на границе чанка -- игнорируем */ }
        }
      }

      // Финальный рендер вне rAF -- гарантирует, что последний кусочек
      // ответа виден сразу после завершения стрима, не дожидаясь кадра.
      pending.textContent = full || '(пустой ответ)';
      chatEl.scrollTop = chatEl.scrollHeight;
    } catch (err) {
      // Типичная причина здесь -- CORS (сервер не прислал
      // Access-Control-Allow-Origin) либо сеть/URL неверен.
      pending.textContent =
        'Не удалось получить ответ (' + err.message + '). ' +
        'Проверьте URL и что эндпоинт отдаёт CORS-заголовки.';
      pending.className = 'msg err';
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text) return;
    promptEl.value = '';
    sendMessage(text);
  });

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
})();
</script>
</body>
</html>
